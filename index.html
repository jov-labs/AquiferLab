<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AQUIFER LAB</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <dialog id="welcome-dialog" class="welcome-dialog" aria-label="AquiferLab" open>
      <div class="language-switcher" aria-label="">
        <button id="language-es" type="button">ES</button>
        <button id="language-en" type="button">EN</button>
      </div>
      <p>AQUIFER LAB</p>
      <p id="welcome-copy"></p>
      <form method="dialog">
        <button id="welcome-start" type="submit"></button>
      </form>
    </dialog>

    <div id="app">
      <aside class="panel controls-panel" aria-label="">
        <div>
          <div class="panel-actions">
            <button id="home-button" class="home-button" type="button"></button>
            <button id="quick-guide-button" class="quick-guide-button" type="button"></button>
            <button id="scenario-comparator-toggle" class="quick-guide-button" type="button" aria-controls="scenario-comparator-panel" aria-expanded="false"></button>
            <button id="export-hydro-model" class="quick-guide-button" type="button"></button>
          </div>
          <p id="public-controls-copy" class="panel-copy"></p>
        </div>

        <div class="slider-control">
          <span class="help-term">
            <label id="public-pumping-a" for="well-a-rate"></label><button class="help-button" type="button" data-help-key="well-a-pumping">?</button>
          </span>
          <output id="well-a-value" for="well-a-rate">0 l/s</output>
          <input id="well-a-rate" type="range" min="0" max="50" step="1" value="0" />
        </div>

        <div class="slider-control">
          <span class="help-term">
            <label id="public-pumping-b" for="well-b-rate"></label><button class="help-button" type="button" data-help-key="well-b-pumping">?</button>
          </span>
          <output id="well-b-value" for="well-b-rate">0 l/s</output>
          <input id="well-b-rate" type="range" min="0" max="50" step="1" value="0" />
        </div>

        <section class="drawdown-legend" aria-label="">
          <h3 id="public-drawdown-title"></h3>
          <div id="drawdown-scale" class="drawdown-scale" aria-hidden="true"></div>
          <div class="drawdown-labels">
            <span id="drawdown-legend-minimum">—</span>
            <span id="drawdown-legend-zero" hidden>0.000 m</span>
            <span id="drawdown-legend-maximum">—</span>
          </div>
        </section>

        <details class="technical-controls">
          <summary id="technical-controls-summary"></summary>

          <div class="technical-controls-content">
            <div class="slider-control">
              <span class="help-term">
                <label id="well-radius-a-label" for="well-a-radius"></label><button class="help-button" type="button" data-help-key="well-radius">?</button>
              </span>
              <output id="well-a-radius-value" for="well-a-radius">0.10 m</output>
              <input id="well-a-radius" type="range" min="0.05" max="0.50" step="0.01" value="0.10" />
            </div>

            <div class="slider-control">
              <span class="help-term">
                <label id="well-radius-b-label" for="well-b-radius"></label><button class="help-button" type="button" data-help-key="well-radius">?</button>
              </span>
              <output id="well-b-radius-value" for="well-b-radius">0.10 m</output>
              <input id="well-b-radius" type="range" min="0.05" max="0.50" step="0.01" value="0.10" />
            </div>

            <div class="checkbox-control">
              <input id="show-qualitative-streamlines" type="checkbox" checked />
              <span class="help-term">
                <label id="qualitative-flow-label" for="show-qualitative-streamlines"></label><button class="help-button" type="button" data-help-key="qualitative-flow-lines">?</button>
              </span>
            </div>

            <div class="checkbox-control">
              <input id="enable-geological-cut" type="checkbox" />
              <span class="help-term">
                <label id="geological-cut-label" for="enable-geological-cut"></label><button class="help-button" type="button" data-help-key="geological-cut">?</button>
              </span>
            </div>

            <label class="cut-position-control" for="cut-position">
              <span><span id="cut-position-label"></span> <output id="cut-position-value" for="cut-position">—</output></span>
              <span class="cut-range">
                <span>0 %</span>
                <input id="cut-position" type="range" min="0" max="100" step="1" value="50" disabled />
                <span>100 %</span>
              </span>
            </label>

        <section class="parameter-section" aria-labelledby="parameter-title">
          <h2 id="parameter-title"></h2>

          <div class="slider-control">
            <span class="help-term">
              <label id="hydraulic-conductivity-label" for="hydraulic-conductivity-exponent"></label><button class="help-button" type="button" data-help-key="hydraulic-conductivity">?</button>
            </span>
            <output id="hydraulic-conductivity-value" for="hydraulic-conductivity-exponent">—</output>
            <input id="hydraulic-conductivity-exponent" type="range" min="-6" max="-4" step="0.1" />
          </div>

          <div class="slider-control">
            <span class="help-term">
              <label id="recharge-label" for="recharge"></label><button class="help-button" type="button" data-help-key="recharge">?</button>
            </span>
            <output id="recharge-value" for="recharge">—</output>
            <input id="recharge" type="range" min="0" max="500" step="10" />
          </div>

          <div class="slider-control">
            <span class="help-term">
              <label id="aquifer-thickness-label" for="aquifer-thickness"></label><button class="help-button" type="button" data-help-key="aquifer-thickness">?</button>
            </span>
            <output id="aquifer-thickness-value" for="aquifer-thickness">—</output>
            <input id="aquifer-thickness" type="range" min="10" max="100" step="5" />
          </div>

          <div class="slider-control">
            <span class="help-term">
              <label id="river-head-label" for="river-head"></label><button class="help-button" type="button" data-help-key="river-head">?</button>
            </span>
            <output id="river-head-value" for="river-head">—</output>
            <input id="river-head" type="range" min="80" max="120" step="1" />
          </div>

          <label class="number-control" for="aquifer-top-elevation">
            <span id="aquifer-top-elevation-label"></span>
            <span class="number-input">
              <input id="aquifer-top-elevation" type="number" step="1" value="0" />
              <span class="unit">m</span>
            </span>
          </label>

          <p id="hydraulic-block-note" class="parameter-note"></p>
          <p id="aquifer-top-note" class="parameter-note"></p>
          <section class="model-settings">
            <p><span class="help-term"><span id="mesh-resolution-label"></span><button class="help-button" type="button" data-help-key="mesh-resolution">?</button></span><strong class="atomic-value">41 × 41</strong></p>
            <p><span class="help-term"><span id="maximum-iterations-label"></span><button class="help-button" type="button" data-help-key="maximum-iterations">?</button></span><strong class="atomic-value">20,000</strong></p>
            <p><span class="help-term"><span id="solver-tolerance-label"></span><button class="help-button" type="button" data-help-key="solver-tolerance">?</button></span><strong class="atomic-value">1e−6 m</strong></p>
          </section>
        </section>

        <div class="legend" aria-label="">
          <p><span class="legend-item"><span class="legend-swatch river"></span><span id="river-level-legend"></span></span></p>
          <p><span class="legend-item"><span class="legend-swatch surface"></span><span id="piezometric-surface-label"></span></span></p>
          <p><span class="legend-item"><span class="legend-swatch flow"></span><span class="help-term"><span id="qualitative-flow-legend"></span><button class="help-button" type="button" data-help-key="qualitative-flow-lines">?</button></span></span></p>
          <p><span class="legend-item"><span class="legend-swatch aquifer"></span><span id="confined-aquifer-legend"></span></span></p>
          <p id="visual-context-note"></p>
          <p><span id="piezometric-reference"></span></p>
          <p><span class="help-term"><span id="darcy-arrows-label"></span><button class="help-button" type="button" data-help-key="darcy-arrows">?</button></span></p>
          <p id="arrow-scale-note"></p>
          <p id="darcy-direction-note"></p>
          <p id="geological-cut-note"></p>
        </div>
          </div>
        </details>
      </aside>

      <aside id="scenario-comparator-panel" class="scenario-comparator-panel" aria-labelledby="scenario-comparator-panel-title" hidden>
        <div class="scenario-comparator-panel-header">
          <h2 id="scenario-comparator-panel-title"></h2>
          <button id="scenario-comparator-close" class="scenario-comparator-close" type="button"></button>
        </div>
        <div id="scenario-comparator-root"></div>
        <div id="scenario-comparator-resize-handle" class="scenario-comparator-resize-handle" role="separator" aria-orientation="vertical" aria-label="" tabindex="0"></div>
      </aside>

      <main class="scene-panel" aria-label="">
        <div id="scene-container"></div>
        <section id="mesh-invalid-card" class="mesh-invalid-card" aria-live="assertive" hidden>
          <h3 id="mesh-invalid-card-title"></h3>
          <p id="mesh-invalid-card-description"></p>
          <p id="mesh-invalid-card-action"></p>
        </section>
        <p id="scene-hint" class="scene-hint"></p>
      </main>

      <aside class="panel results-panel" aria-labelledby="results-title">
        <div class="results-overview">
          <div class="results-heading">
            <p id="current-solution-label" class="eyebrow"></p>
            <h2 id="results-title"></h2>
          </div>

          <section class="public-result" aria-labelledby="public-result-title">
            <h3 id="public-result-title"></h3>
            <p id="public-result-summary" aria-live="polite"></p>

            <dl class="public-well-results">
              <div>
                <dt id="public-well-a-label"></dt>
                <dd id="public-well-a-drawdown">—</dd>
              </div>
              <div>
                <dt id="public-well-b-label"></dt>
                <dd id="public-well-b-drawdown">—</dd>
              </div>
            </dl>

            <p id="public-well-note" class="parameter-note"></p>

            <div id="public-model-warning" class="public-model-warning" aria-live="polite"></div>
          </section>
        </div>

        <details class="technical-results">
          <summary id="technical-results-summary"></summary>
          <div class="technical-results-content">

        <dl class="metrics">
          <div>
            <dt><span class="help-term"><span id="metric-status-label"></span><button class="help-button" type="button" data-help-key="status">?</button></span></dt>
            <dd id="result-status" data-status="pending"></dd>
          </div>
          <div>
            <dt><span class="help-term"><span id="metric-iterations-label"></span><button class="help-button" type="button" data-help-key="iterations">?</button></span></dt>
            <dd id="result-iterations">—</dd>
          </div>
          <div>
            <dt><span class="help-term"><span id="metric-min-head-label"></span><button class="help-button" type="button" data-help-key="minimum-grid-head">?</button></span></dt>
            <dd id="result-min-head">—</dd>
          </div>
          <div>
            <dt><span class="help-term"><span id="metric-max-head-label"></span><button class="help-button" type="button" data-help-key="maximum-head">?</button></span></dt>
            <dd id="result-max-head">—</dd>
          </div>
          <div>
            <dt><span class="help-term"><span id="metric-head-a-label"></span><button class="help-button" type="button" data-help-key="well-a-cell-head">?</button></span></dt>
            <dd id="result-well-a-head">—</dd>
          </div>
          <div>
            <dt><span class="help-term"><span id="metric-head-b-label"></span><button class="help-button" type="button" data-help-key="well-b-cell-head">?</button></span></dt>
            <dd id="result-well-b-head">—</dd>
          </div>
          <div>
            <dt><span class="help-term"><span id="metric-estimated-head-a-label"></span><button class="help-button" type="button" data-help-key="well-a-estimated-head">?</button></span></dt>
            <dd id="result-estimated-well-a-head">—</dd>
          </div>
          <div>
            <dt><span class="help-term"><span id="metric-estimated-head-b-label"></span><button class="help-button" type="button" data-help-key="well-b-estimated-head">?</button></span></dt>
            <dd id="result-estimated-well-b-head">—</dd>
          </div>
          <div>
            <dt><span class="help-term"><span id="metric-darcy-label"></span><button class="help-button" type="button" data-help-key="maximum-darcy-flux">?</button></span></dt>
            <dd id="result-darcy-max">—</dd>
          </div>
          <div>
            <dt><span class="help-term"><span id="metric-max-drawdown-label"></span><button class="help-button" type="button" data-help-key="maximum-grid-drawdown">?</button></span></dt>
            <dd id="result-max-drawdown">—</dd>
          </div>
          <div>
            <dt><span class="help-term"><span id="metric-drawdown-a-label"></span><button class="help-button" type="button" data-help-key="well-a-cell-drawdown">?</button></span></dt>
            <dd id="result-well-a-drawdown">—</dd>
          </div>
          <div>
            <dt><span class="help-term"><span id="metric-drawdown-b-label"></span><button class="help-button" type="button" data-help-key="well-b-cell-drawdown">?</button></span></dt>
            <dd id="result-well-b-drawdown">—</dd>
          </div>
          <div>
            <dt><span class="help-term"><span id="metric-estimated-drawdown-a-label"></span><button class="help-button" type="button" data-help-key="well-a-estimated-drawdown">?</button></span></dt>
            <dd id="result-estimated-well-a-drawdown">—</dd>
          </div>
          <div>
            <dt><span class="help-term"><span id="metric-estimated-drawdown-b-label"></span><button class="help-button" type="button" data-help-key="well-b-estimated-drawdown">?</button></span></dt>
            <dd id="result-estimated-well-b-drawdown">—</dd>
          </div>
        </dl>
        <p class="parameter-note"><span class="help-term"><span id="peaceman-note"></span><button class="help-button" type="button" data-help-key="peaceman">?</button></span></p>
        <section class="confined-validity" aria-labelledby="confined-validity-title">
          <h3><span class="help-term"><span id="confined-validity-title"></span><button class="help-button" type="button" data-help-key="confined-validity">?</button></span></h3>
          <p id="confined-validity-status" data-status="pending" aria-live="polite">—</p>
          <p id="confined-validity-summary" class="parameter-note"></p>
          <p id="confined-validity-warnings" class="solver-message"></p>
          <p id="confined-validity-extrapolation" class="parameter-note" hidden></p>
        </section>
          </div>
        </details>

        <p id="solver-message" class="solver-message" aria-live="polite"></p>
      </aside>
    </div>
    <dialog id="learning-dialog" class="learning-dialog" aria-modal="true">
      <header>
        <h2 id="learning-dialog-title"></h2>
        <button id="learning-dialog-close" type="button"></button>
      </header>
      <div id="learning-dialog-content"></div>
    </dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
